name: Compiler APK et EXE
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    name: APK Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v4
        with:
          channel: stable
          cache: true
      - name: Generer les projets natifs
        run: flutter create --project-name controle_pc_distance --platforms=android,windows .
      - name: Appliquer les icones et permissions
        run: python3 tools/prepare_platforms.py
      - name: Installer les dependances
        run: flutter pub get
      - name: Analyser le code
        run: flutter analyze --no-fatal-infos
      - name: Compiler APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: controle_pc_distance_v4_android
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
  windows:
    name: EXE Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v4
        with:
          channel: stable
          cache: true
      - name: Generer les projets natifs
        run: flutter create --project-name controle_pc_distance --platforms=android,windows .
      - name: Appliquer les icones et permissions
        run: python tools/prepare_platforms.py
      - name: Installer les dependances
        run: flutter pub get
      - name: Compiler EXE
        run: flutter build windows --release
      - name: Emballer EXE et ses DLL
        shell: pwsh
        run: Compress-Archive -Path 'build/windows/x64/runner/Release/*' -DestinationPath 'controle_pc_distance_v4_windows.zip' -Force
      - uses: actions/upload-artifact@v4
        with:
          name: controle_pc_distance_v4_windows
          path: controle_pc_distance_v4_windows.zip
          if-no-files-found: error
  release:
    name: Publier Release V4
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: controle_pc_distance_v4_android
          path: dist/android
      - uses: actions/download-artifact@v4
        with:
          name: controle_pc_distance_v4_windows
          path: dist/windows
      - name: Renommer APK
        run: cp dist/android/app-release.apk dist/controle_pc_distance_v4.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v4
          target_commitish: main
          name: Controle PC Distance - V4
          body: |
            V4 : premier apercu de captures Windows sur Android en reseau local avec activation explicite. ATTENTION : images non chiffrees, reseau prive de confiance seulement.
            Le controle souris/clavier, streaming fluide, transferts, relais Internet et Tuya ne sont pas encore implementes.
            Sur Windows, decompresser toute l'archive avant de lancer l'EXE.
          files: |
            dist/controle_pc_distance_v4.apk
            dist/windows/controle_pc_distance_v4_windows.zip
          overwrite_files: true
